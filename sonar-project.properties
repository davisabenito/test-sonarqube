# Configuración de SonarQube para el proyecto
# Reemplaza estos valores con los de tu proyecto

# Clave única del proyecto en SonarQube
sonar.projectKey=prueba

# Nombre del proyecto
sonar.projectName=Prueba SonarQube

# Versión del proyecto
sonar.projectVersion=1.0

# Codificación de los archivos fuente
sonar.sourceEncoding=UTF-8

# Directorios de código fuente (solo archivos Python principales)
sonar.sources=data_cleaning.py

# Directorios de tests (solo archivos de test)
sonar.tests=test_data_cleaning.py

# Patrones de exclusión
sonar.exclusions=venv/**,**/*.csv,**/*.md,.git/**,.github/**,pytest.ini,coverage.xml,.coverage

# Exclusiones de tests
sonar.test.exclusions=test_*.py

# Lenguaje principal
sonar.python.version=3.9

# Configuración de coverage
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.jacoco.xmlReportPaths=coverage.xml

# Umbral de coverage (Quality Gate fallará si es menor a 90%)
sonar.coverage.minimum=90.0

# Parámetros de calidad
sonar.qualitygate.wait=true
