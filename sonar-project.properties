# Configuración de SonarCloud
# Organization y Project Key se configuran en SonarCloud

sonar.organization=davisabenito-github
sonar.projectKey=prueba_calidad

# Nombre del proyecto
sonar.projectName=Pruebas SonarCloud

# Versión del proyecto
sonar.projectVersion=1.0

# Codificación de los archivos fuente
sonar.sourceEncoding=UTF-8

# Directorios de código fuente
sonar.sources=data_cleaning.py

# Directorios de tests
sonar.tests=test_data_cleaning.py

# Patrones de exclusión
sonar.exclusions=venv/**,**/*.csv,**/*.md,.git/**,.github/**,pytest.ini,coverage.xml,.coverage

# Exclusiones de tests (eliminar esta línea para que analice los tests)
# sonar.test.exclusions=test_*.py

# Lenguaje principal
sonar.python.version=3.9

# Configuración de coverage
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.jacoco.xmlReportPaths=coverage.xml
