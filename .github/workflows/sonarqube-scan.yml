# name: SonarCloud Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      is_coverage:
        description: "Validar coverage (TRUE) o severidad (FALSE)"
        required: true
        type: choice
        options:
          - "TRUE"
          - "FALSE"
        default: "FALSE"

permissions:
  contents: read
  pull-requests: read

env:
  IS_COVERAGE: ${{ github.event.inputs.is_coverage || 'FALSE' }}
  SONAR_ORGANIZATION: davisabenito-github
  SONAR_PROJECT_KEY: prueba_calidad

jobs:
  sonarcloud:
    name: SonarCloud + Bandit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest pytest-cov bandit
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Run tests with coverage
        if: env.IS_COVERAGE == 'TRUE'
        run: |
          python -m pytest test_data_cleaning.py \
            --cov=data_cleaning \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=30

      - name: Verify coverage.xml
        if: env.IS_COVERAGE == 'TRUE'
        run: |
          test -s coverage.xml || {
            echo "::error::coverage.xml no se generó o está vacío"
            exit 1
          }
          echo "coverage.xml generado"
          head -20 coverage.xml

      - name: Run Bandit Security Scan
        run: |
          set +e
          bandit -r . -f json -o bandit-report.json \
            --exclude venv/,.venv/,.git/,.github/ \
            --exit-zero
          bandit -r . -f txt \
            --exclude venv/,.venv/,.git/,.github/ \
            --exit-zero
          set -e

          if [ ! -s bandit-report.json ]; then
            echo "::error::No se generó bandit-report.json"
            exit 1
          fi

          jq '{
            total: (.results | length),
            high: ([.results[] | select(.issue_severity == "HIGH")] | length),
            medium: ([.results[] | select(.issue_severity == "MEDIUM")] | length),
            low: ([.results[] | select(.issue_severity == "LOW")] | length)
          }' bandit-report.json

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.sources=data_cleaning.py
            -Dsonar.tests=test_data_cleaning.py
            -Dsonar.python.version=3.9
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.exclusions=venv/**,.venv/**,**/*.csv,**/*.md,.git/**,.github/**,pytest.ini,coverage.xml,.coverage
            -Dsonar.log.level=DEBUG

      - name: Debug SonarCloud API responses
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ env.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ env.SONAR_ORGANIZATION }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -u

          echo "=== Contexto ==="
          echo "Evento: $GITHUB_EVENT_NAME"
          echo "Proyecto: $SONAR_PROJECT_KEY"
          echo "Organización: $SONAR_ORGANIZATION"
          echo "PR: ${PR_NUMBER:-no aplica}"

          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::El secret SONAR_TOKEN está vacío o no está disponible para este evento."
            exit 1
          fi

          if [ ! -s .scannerwork/report-task.txt ]; then
            echo "::error::No existe .scannerwork/report-task.txt; revisa el paso SonarCloud Scan."
            exit 1
          fi

          echo "--- report-task.txt ---"
          cat .scannerwork/report-task.txt

          CE_TASK_ID=$(sed -n 's/^ceTaskId=//p' .scannerwork/report-task.txt)
          DASHBOARD_URL=$(sed -n 's/^dashboardUrl=//p' .scannerwork/report-task.txt)

          if [ -z "$CE_TASK_ID" ]; then
            echo "::error::No se pudo leer ceTaskId desde report-task.txt"
            exit 1
          fi

          echo "Dashboard: $DASHBOARD_URL"
          echo "CE task ID: $CE_TASK_ID"

          api_get() {
            local label="$1"
            local url="$2"
            local output="$3"
            shift 3

            echo ""
            echo "=== $label ==="
            local code
            code=$(curl --silent --show-error \
              --connect-timeout 15 --max-time 60 \
              --output "$output" \
              --write-out '%{http_code}' \
              --user "${SONAR_TOKEN}:" \
              "$@" "$url") || {
                echo "::error::curl falló al consultar $label"
                return 1
              }

            echo "HTTP_STATUS=$code"
            if jq empty "$output" >/dev/null 2>&1; then
              jq '.' "$output"
            else
              echo "La respuesta no es JSON válido:"
              cat "$output"
            fi

            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::warning::$label devolvió HTTP $code"
            fi
          }

          echo ""
          echo "=== Esperando a que termine la tarea CE ==="
          CE_STATUS="UNKNOWN"
          ANALYSIS_ID=""
          for attempt in $(seq 1 36); do
            HTTP_CODE=$(curl --silent --show-error \
              --connect-timeout 15 --max-time 60 \
              --output /tmp/sonar-ce.json \
              --write-out '%{http_code}' \
              --user "${SONAR_TOKEN}:" \
              --get --data-urlencode "id=${CE_TASK_ID}" \
              "https://sonarcloud.io/api/ce/task") || {
                echo "::error::curl falló al consultar la tarea CE"
                exit 1
              }

            echo "Intento $attempt/36 - HTTP_STATUS=$HTTP_CODE"
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              cat /tmp/sonar-ce.json
              exit 1
            fi

            CE_STATUS=$(jq -r '.task.status // "UNKNOWN"' /tmp/sonar-ce.json)
            ANALYSIS_ID=$(jq -r '.task.analysisId // empty' /tmp/sonar-ce.json)
            echo "CE_STATUS=$CE_STATUS"

            if [ "$CE_STATUS" = "SUCCESS" ] || [ "$CE_STATUS" = "FAILED" ] || [ "$CE_STATUS" = "CANCELED" ]; then
              break
            fi
            sleep 5
          done

          echo "--- Última respuesta CE ---"
          jq '.' /tmp/sonar-ce.json || cat /tmp/sonar-ce.json
          echo "CE_STATUS=$CE_STATUS"
          echo "ANALYSIS_ID=${ANALYSIS_ID:-no disponible}"

          if [ "$CE_STATUS" != "SUCCESS" ]; then
            echo "::warning::La tarea CE terminó con estado $CE_STATUS; revisa la respuesta anterior."
          fi

          if [ -n "$ANALYSIS_ID" ]; then
            api_get "Quality Gate del análisis exacto" \
              "https://sonarcloud.io/api/qualitygates/project_status" \
              "/tmp/sonar-qg.json" \
              --get --data-urlencode "analysisId=${ANALYSIS_ID}"
          else
            echo "::warning::No hay analysisId en la respuesta CE; se consultará por proyecto/PR."
            if [ -n "${PR_NUMBER:-}" ]; then
              api_get "Quality Gate del PR" \
                "https://sonarcloud.io/api/qualitygates/project_status" \
                "/tmp/sonar-qg.json" \
                --get \
                --data-urlencode "projectKey=${SONAR_PROJECT_KEY}" \
                --data-urlencode "organization=${SONAR_ORGANIZATION}" \
                --data-urlencode "pullRequest=${PR_NUMBER}"
            else
              api_get "Quality Gate del proyecto" \
                "https://sonarcloud.io/api/qualitygates/project_status" \
                "/tmp/sonar-qg.json" \
                --get \
                --data-urlencode "projectKey=${SONAR_PROJECT_KEY}" \
                --data-urlencode "organization=${SONAR_ORGANIZATION}"
            fi
          fi

          METRIC_ARGS=(
            --get
            --data-urlencode "component=${SONAR_PROJECT_KEY}"
            --data-urlencode "metricKeys=bugs,code_smells,coverage,vulnerabilities,duplicated_lines_density,sqale_rating,reliability_rating,security_rating"
          )
          if [ -n "${PR_NUMBER:-}" ]; then
            METRIC_ARGS+=(--data-urlencode "pullRequest=${PR_NUMBER}")
          fi
          api_get "Métricas" \
            "https://sonarcloud.io/api/measures/component" \
            "/tmp/sonar-metrics.json" \
            "${METRIC_ARGS[@]}"

          ISSUE_ARGS=(
            --get
            --data-urlencode "organization=${SONAR_ORGANIZATION}"
            --data-urlencode "componentKeys=${SONAR_PROJECT_KEY}"
            --data-urlencode "resolved=false"
            --data-urlencode "ps=10"
          )
          if [ -n "${PR_NUMBER:-}" ]; then
            ISSUE_ARGS+=(--data-urlencode "pullRequest=${PR_NUMBER}")
          fi
          api_get "Issues abiertos (máximo 10)" \
            "https://sonarcloud.io/api/issues/search" \
            "/tmp/sonar-issues.json" \
            "${ISSUE_ARGS[@]}"

          echo ""
          echo "=== Resumen diagnóstico ==="
          echo "CE_STATUS=$CE_STATUS"
          echo "ANALYSIS_ID=${ANALYSIS_ID:-no disponible}"
          echo "QG_STATUS=$(jq -r '.projectStatus.status // "NONE_OR_ERROR"' /tmp/sonar-qg.json 2>/dev/null)"
          echo "METRICS_COUNT=$(jq -r '.component.measures | length' /tmp/sonar-metrics.json 2>/dev/null || echo unknown)"
          echo "ISSUES_TOTAL=$(jq -r '.total // "unknown"' /tmp/sonar-issues.json 2>/dev/null)"
          echo "Dashboard: $DASHBOARD_URL"

      - name: Validate SonarCloud severity thresholds
        if: env.IS_COVERAGE == 'FALSE'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ env.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ env.SONAR_ORGANIZATION }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          echo "=== Validando umbrales de severidad de SonarCloud ==="
          echo "Umbrales configurados:"
          echo "  BLOCKER ≤ 1"
          echo "  CRITICAL ≤ 1"
          echo "  MAJOR ≤ 2"
          echo "  MINOR = 0 (warning)"
          echo "  INFO = 0 (info)"
          echo ""

          # Obtener issues por severidad desde SonarCloud
          get_issue_count() {
            local severity="$1"
            local args=(
              --get
              --data-urlencode "organization=${SONAR_ORGANIZATION}"
              --data-urlencode "componentKeys=${SONAR_PROJECT_KEY}"
              --data-urlencode "resolved=false"
              --data-urlencode "severities=${severity}"
              --data-urlencode "ps=1"
            )
            if [ -n "${PR_NUMBER:-}" ]; then
              args+=(--data-urlencode "pullRequest=${PR_NUMBER}")
            fi

            HTTP_CODE=$(curl -sS -u "${SONAR_TOKEN}:" \
              -o /tmp/sonar-issues-${severity}.json -w '%{http_code}' \
              "${args[@]}" \
              "https://sonarcloud.io/api/issues/search")

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "::warning::No se pudo consultar issues de severidad ${severity} (HTTP $HTTP_CODE)"
              echo "0"
              return
            fi

            jq -r '.total // 0' /tmp/sonar-issues-${severity}.json
          }

          BLOCKER=$(get_issue_count "BLOCKER")
          CRITICAL=$(get_issue_count "CRITICAL")
          MAJOR=$(get_issue_count "MAJOR")
          MINOR=$(get_issue_count "MINOR")
          INFO=$(get_issue_count "INFO")

          echo "=== Issues por severidad ==="
          echo "BLOCKER: $BLOCKER (máximo: 1)"
          echo "CRITICAL: $CRITICAL (máximo: 1)"
          echo "MAJOR: $MAJOR (máximo: 2)"
          echo "MINOR: $MINOR (esperado: 0)"
          echo "INFO: $INFO (esperado: 0)"
          echo ""

          # Validar umbrales
          FAILED=0

          if [ "$BLOCKER" -gt 1 ]; then
            echo "::error::BLOCKER ($BLOCKER) excede el máximo permitido (1)"
            FAILED=1
          else
            echo "✅ BLOCKER: $BLOCKER dentro del límite (≤1)"
          fi

          if [ "$CRITICAL" -gt 1 ]; then
            echo "::error::CRITICAL ($CRITICAL) excede el máximo permitido (1)"
            FAILED=1
          else
            echo "✅ CRITICAL: $CRITICAL dentro del límite (≤1)"
          fi

          if [ "$MAJOR" -gt 2 ]; then
            echo "::error::MAJOR ($MAJOR) excede el máximo permitido (2)"
            FAILED=1
          else
            echo "✅ MAJOR: $MAJOR dentro del límite (≤2)"
          fi

          if [ "$MINOR" -gt 0 ]; then
            echo "::warning::MINOR ($MINOR) debería ser 0"
          else
            echo "✅ MINOR: $MINOR (correcto)"
          fi

          if [ "$INFO" -gt 0 ]; then
            echo "::notice::INFO ($INFO) presente (no bloqueante)"
          else
            echo "✅ INFO: $INFO (correcto)"
          fi

          echo ""
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Los umbrales de severidad de SonarCloud no cumplen los requisitos"
            exit 1
          fi

          echo "✅ Todos los umbrales de severidad están dentro de los límites"

          # Agregar resumen al GitHub Step Summary
          echo "## Resumen de Validación de Severidad SonarCloud" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severidad | Cantidad | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| BLOCKER | $BLOCKER | $( [ "$BLOCKER" -le 1 ] && echo "✅" || echo "❌" ) |" >> $GITHUB_STEP_SUMMARY
          echo "| CRITICAL | $CRITICAL | $( [ "$CRITICAL" -le 1 ] && echo "✅" || echo "❌" ) |" >> $GITHUB_STEP_SUMMARY
          echo "| MAJOR | $MAJOR | $( [ "$MAJOR" -le 2 ] && echo "✅" || echo "❌" ) |" >> $GITHUB_STEP_SUMMARY
          echo "| MINOR | $MINOR | $( [ "$MINOR" -eq 0 ] && echo "✅" || echo "⚠️" ) |" >> $GITHUB_STEP_SUMMARY
          echo "| INFO | $INFO | ℹ️ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Umbrales:** BLOCKER ≤ 1, CRITICAL ≤ 1, MAJOR ≤ 2, MINOR = 0" >> $GITHUB_STEP_SUMMARY

      - name: Validate Bandit thresholds
        if: env.IS_COVERAGE == 'FALSE'
        run: |
          set -euo pipefail

          if [ ! -s bandit-report.json ]; then
            echo "::error::No se encontró bandit-report.json"
            exit 1
          fi

          HIGH=$(jq '[.results[] | select(.issue_severity == "HIGH")] | length' bandit-report.json)
          MEDIUM=$(jq '[.results[] | select(.issue_severity == "MEDIUM")] | length' bandit-report.json)
          TOTAL=$(jq '.results | length' bandit-report.json)

          echo "Bandit total: $TOTAL"
          echo "HIGH: $HIGH (máximo permitido: 2)"
          echo "MEDIUM: $MEDIUM (máximo permitido: 5)"

          jq -r '.results[]
            | select(.issue_severity == "HIGH" or .issue_severity == "MEDIUM")
            | "\(.issue_severity) \(.filename):\(.line_number) - \(.issue_text)"' \
            bandit-report.json

          if [ "$HIGH" -gt 2 ] || [ "$MEDIUM" -gt 5 ]; then
            echo "::error::Bandit excede los umbrales de severidad."
            exit 1
          fi

      - name: Check coverage from SonarCloud
        if: env.IS_COVERAGE == 'TRUE'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ env.SONAR_PROJECT_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          echo "Consultando coverage en SonarCloud..."
          ARGS=(--get --data-urlencode "component=${SONAR_PROJECT_KEY}"
            --data-urlencode "metricKeys=coverage")
          if [ -n "${PR_NUMBER:-}" ]; then
            ARGS+=(--data-urlencode "pullRequest=${PR_NUMBER}")
          fi

          HTTP_CODE=$(curl -sS -u "${SONAR_TOKEN}:" \
            -o /tmp/sonar-coverage.json -w '%{http_code}' \
            "${ARGS[@]}" \
            "https://sonarcloud.io/api/measures/component")

          echo "HTTP_STATUS=$HTTP_CODE"
          jq '.' /tmp/sonar-coverage.json || cat /tmp/sonar-coverage.json

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::No se pudo consultar coverage (HTTP $HTTP_CODE)"
            exit 1
          fi

          COVERAGE=$(jq -r '.component.measures[]? | select(.metric == "coverage") | .value' \
            /tmp/sonar-coverage.json)

          if [ -z "$COVERAGE" ] || [ "$COVERAGE" = "null" ]; then
            echo "::error::SonarCloud no devolvió la métrica coverage."
            exit 1
          fi

          echo "Coverage actual: ${COVERAGE}%"
          if awk -v c="$COVERAGE" 'BEGIN { exit !(c < 90) }'; then
            echo "::error::Coverage ${COVERAGE}% es menor al 90% requerido."
            exit 1
          fi
          echo "Coverage cumple el mínimo de 90%."

      - name: SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          pollingTimeoutSec: 300
