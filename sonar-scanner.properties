# Configuración de SonarScanner para conectar con SonarQube local
# Este archivo se usa en GitHub Actions con los secretos

# URL de SonarQube (se reemplaza con variable de entorno en GitHub Actions)
sonar.host.url=${SONAR_HOST_URL}

# Token de autenticación (se reemplaza con secret en GitHub Actions)
sonar.login=${SONAR_TOKEN}
